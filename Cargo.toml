[package]
name = "spectra-sim"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
description = "Deterministic physics-based RF, radar, ISAC and space-link simulation toolkit"
repository = "https://github.com/nailuJ-dev/spectra-sim"
keywords = ["rf", "radar", "isac", "simulation", "space"]
categories = ["simulation", "science"]

[lib]
name = "spectra_sim"
path = "src/lib.rs"

[[bin]]
name = "spectra-sim"
path = "src/bin/spectra-sim.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
sgp4 = "=2.4.0"
sofars = "=0.6.1"
quick-xml = "=0.41.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "spectra-sim"
dynamic = ["version"]
description = "Deterministic physics-based RF, radar, ISAC and space-link simulation toolkit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]
license = "Apache-2.0 OR MIT"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[tool.maturin]
python-source = "python"
module-name = "spectra_sim._spectra_sim"
features = ["pyo3/extension-module"]

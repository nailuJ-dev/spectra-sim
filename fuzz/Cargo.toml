test = false
doc = false
bench = false

[[bin]]
name = "omm_xml"
path = "fuzz_targets/omm_xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "oem_kvn"
path = "fuzz_targets/oem_kvn.rs"
test = false
doc = false
bench = false

[[bin]]
name = "oem_xml"
path = "fuzz_targets/oem_xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ocm_kvn"
path = "fuzz_targets/ocm_kvn.rs"
test = false

[package]
name = "spectra-sim-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.spectra-sim]
path = ".."

# Not a member of the root workspace (root Cargo.toml excludes `fuzz`).
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "tle"
path = "fuzz_targets/tle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "omm_json"
path = "fuzz_targets/omm_json.rs"
test = false
doc = false
bench = false

